<section id="main-games-wiew" class="bg-[url('http://localhost:4000/api/games/images/background-images/games-module/backgrounds/bg1.jpg')] bg-no-repeat bg-fit bg-opacity-20">
  <app-main-nav-bar></app-main-nav-bar>
  <app-search-bar></app-search-bar>
  <app-upper-carousel></app-upper-carousel>
  <!-- AD GAME, IMPROVE LATER -->
  <!-- <div class="w-full text-center">
    <a [routerLink]="['/add-edit-game']" class="bg-green-600 w-full px-2 py-1 rounded-sm"
      >Add game</a
    >
  </div> -->
  <div class="game-grid xl:w-[90%] mx-auto rounded-lg">
    @defer (when store.gamesData.games().length) { @for(game of store.gamesData.games(); track
    game.id) { @defer (on viewport) {
    <app-game-preview [game]="game" />
    } @placeholder {
    <div class="placeholder">Loading</div>
    } } } @placeholder {
    <div class="placeholder">Loading</div>
    }
  </div>
  <div class="card flex justify-center">
    <p-paginator
      (onPageChange)="onPageChange($event)"
      [first]="first"
      [rows]="rows"
      [totalRecords]="store.gamesData.total()"
      [rowsPerPageOptions]="[10, 20, 30, 40]"
    />
  </div>
</section>
