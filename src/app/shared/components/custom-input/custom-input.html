<div class="form-group">
  <label for="customInput">{{ label() }}</label>
  <input
    id="customInput"
    [formControl]="control()"
    [type]="type()"
    [attr.placeholder]="placeHolder()"
  />

  @if(control().invalid && control().touched) {
  <small class="error">{{ errorMessage() }}</small>
  }
</div>
